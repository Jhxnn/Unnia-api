# Ambiente do Unnia.
#   docker compose up -d                  sobe o PostgreSQL e o Mailpit (desenvolvimento: rode a API pela IDE ou pelo Maven)
#   docker compose --profile app up -d    sobe também a API e o site (exige as variáveis abaixo); o site fica em http://localhost:8081
#                                         e espera o repositório Unnia-front clonado como ../Unnia-web
#   docker compose down                   para (os dados ficam no volume; use -v para apagá-los)
# A porta do banco no host é 5433 para não colidir com outro PostgreSQL local na 5432.
services:
  db:
    image: postgres:17-alpine
    container_name: unnia-db
    environment:
      POSTGRES_DB: unnia
      POSTGRES_USER: unnia
      POSTGRES_PASSWORD: unnia
    ports:
      - "5433:5432"
    volumes:
      - unnia-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unnia -d unnia"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Caixa de e-mail de desenvolvimento: recebe tudo que a API envia (SMTP em 1025) e mostra em http://localhost:8025.
  # Nada sai para a internet. Em produção, troque pelas variáveis UNNIA_MAIL_* do provedor real.
  mailpit:
    image: axllent/mailpit:v1.21
    container_name: unnia-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    profiles: ["app"]
    build: .
    container_name: unnia-api
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      UNNIA_MAIL_HOST: mailpit
      UNNIA_PUBLIC_URL: ${UNNIA_PUBLIC_URL:-http://localhost:8081}
      UNNIA_DB_URL: jdbc:postgresql://db:5432/unnia
      UNNIA_DB_USER: unnia
      UNNIA_DB_PASSWORD: unnia
      UNNIA_JWT_SECRET: ${UNNIA_JWT_SECRET:?defina UNNIA_JWT_SECRET com 32 ou mais caracteres}
      UNNIA_ADMIN_EMAIL: ${UNNIA_ADMIN_EMAIL:-admin@unnia.com}
      UNNIA_ADMIN_PASSWORD: ${UNNIA_ADMIN_PASSWORD:?defina UNNIA_ADMIN_PASSWORD}
    ports:
      - "8080:8080"

  web:
    profiles: ["app"]
    build: ../Unnia-web
    container_name: unnia-web
    depends_on:
      - api
    environment:
      API_UPSTREAM: http://api:8080
    ports:
      - "8081:80"

volumes:
  unnia-db-data:
