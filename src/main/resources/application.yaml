spring:
  application:
    name: Unnia
  datasource:
    url: ${UNNIA_DB_URL:jdbc:postgresql://localhost:5432/unnia}
    username: ${UNNIA_DB_USER:unnia}
    password: ${UNNIA_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # o schema é gerenciado pelo Flyway; o Hibernate apenas confere se ele bate com as entidades
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      # imagens de postagens: até 5 MB cada; o limite da requisição dá folga para o cabeçalho do formulário
      max-file-size: 5MB
      max-request-size: 6MB
  # Servidor SMTP do e-mail de confirmação. Em desenvolvimento, o Mailpit do docker-compose recebe as
  # mensagens (caixa em http://localhost:8025). Em produção, aponte para o provedor real.
  mail:
    host: ${UNNIA_MAIL_HOST:localhost}
    port: ${UNNIA_MAIL_PORT:1025}
    username: ${UNNIA_MAIL_USER:}
    password: ${UNNIA_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${UNNIA_MAIL_AUTH:false}
          starttls:
            enable: ${UNNIA_MAIL_STARTTLS:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

unnia:
  # Imagens das postagens: bucket público do Supabase Storage. O envio usa a chave de serviço (secreta, só no servidor).
  # Sem URL e chave, o envio de imagens fica desligado. Veja docs/SUPABASE.md.
  supabase:
    url: ${UNNIA_SUPABASE_URL:}
    service-key: ${UNNIA_SUPABASE_SERVICE_KEY:}
    bucket: ${UNNIA_SUPABASE_BUCKET:unnia-media}
  mail:
    from: ${UNNIA_MAIL_FROM:Unnia <nao-responda@unnia.local>}
  # Chave de assinatura dos tokens (mínimo de 32 caracteres). Defina UNNIA_JWT_SECRET em produção.
  jwt:
    secret: ${UNNIA_JWT_SECRET:}
    # token de acesso curto: quem mantém a sessão é o token de renovação
    expiration: PT15M
  refresh:
    expiration: P30D
  # Limites de requisição, por minuto. As rotas de autenticação contam por IP; as demais por conta
  # (ou por IP, se anônimo). Falhas de login também bloqueiam o e-mail por uma janela.
  rate-limit:
    enabled: true
    auth-per-minute: 10
    general-per-minute: 120
    login-max-failures: 5
    login-window: PT15M
  # Administrador da plataforma, criado na inicialização se ainda não existir.
  # Em produção, defina as duas variáveis de ambiente; sem senha o seed é ignorado.
  admin:
    email: ${UNNIA_ADMIN_EMAIL:admin@unnia.com}
    password: ${UNNIA_ADMIN_PASSWORD:}
